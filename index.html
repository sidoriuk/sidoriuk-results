<title>Sidoriuk Results - July 2026</title>
<style>
:root{--bg:#050708;--ink:#f6fbfb;--muted:#9caeb6;--line:#263941;--panel:#0b1114;--panel2:#11191e;--green:#32e88a;--red:#ee5577;--cyan:#12c7d9;--gold:#d9b86a}
*{box-sizing:border-box}
html{background:#030506}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0%,rgba(18,199,217,.18),transparent 28%),radial-gradient(circle at 82% 12%,rgba(50,232,138,.14),transparent 26%),linear-gradient(145deg,#050708,#071015 52%,#0b070d);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 22px 42px}
.poster{position:relative;overflow:hidden;border:1px solid rgba(18,199,217,.45);background:linear-gradient(180deg,rgba(14,22,27,.97),rgba(5,9,11,.98));border-radius:14px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 58%,rgba(18,199,217,.08) 58% 59%,transparent 59% 100%),repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 1px,transparent 1px 16px);pointer-events:none}
.poster>*{position:relative}
.top{display:grid;grid-template-columns:minmax(0,1fr) 280px 360px;gap:22px;align-items:stretch}
.hero{min-height:246px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,#111b21,#080d10);border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:flex-start}
.logo-panel{min-height:246px;border:1px solid rgba(18,199,217,.32);background:radial-gradient(circle at 50% 35%,rgba(18,199,217,.14),transparent 48%),linear-gradient(180deg,rgba(9,17,21,.92),rgba(5,8,10,.96));border-radius:10px;padding:20px;display:grid;place-items:center;overflow:hidden}
.neon-logo{position:relative;color:#eaffff;font-size:38px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(18,199,217,.88),0 0 34px rgba(18,199,217,.55);transform:skew(-7deg)}
.neon-logo:before,.neon-logo:after{content:"";position:absolute;left:2%;right:2%;height:2px;background:var(--cyan);box-shadow:0 0 12px rgba(18,199,217,.9),0 0 26px rgba(18,199,217,.55)}
.neon-logo:before{top:-14px}.neon-logo:after{bottom:-14px}
.logo-sub{margin-top:30px;text-align:center;color:#7cebf5;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;opacity:.78}
h1{margin:0;font-size:56px;line-height:.92;font-weight:950;letter-spacing:0;color:var(--ink)}
.month{font-size:19px;color:#c8d4d8;font-weight:850;margin-top:12px}
.score{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(8,13,16,.96));border-radius:10px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.label{color:var(--muted);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.score .value{font-size:54px;font-weight:950;line-height:1;margin-top:8px}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pill{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:8px;padding:10px}
.pill strong{display:block;font-size:20px;margin-top:4px;color:var(--ink)}
.pill strong.pos{color:var(--green)}.pill strong.neg{color:var(--red)}
.pos{color:var(--green)}.neg{color:var(--red)}
.chart{margin-top:14px;border:1px solid var(--line);background:linear-gradient(180deg,#081014,#06090b);border-radius:10px;padding:16px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.chart h2{margin:0;font-size:22px}
svg{width:100%;height:auto;display:block;background:linear-gradient(180deg,#081014,#05080a);border:1px solid #17272e;border-radius:8px}
.grid{stroke:#22333b;stroke-width:1}.faint{opacity:.44}.axis{stroke:#8da0a8;stroke-width:1.2}.line{fill:none;stroke:var(--cyan);stroke-width:3.2;filter:drop-shadow(0 0 5px rgba(18,199,217,.34))}.tick{fill:#94a8b0;font-size:13px;font-weight:800}.axis-label{fill:#bdcbd1;font-size:13px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.metric{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:8px;padding:13px 14px;min-height:76px}
.metric-value{font-size:22px;font-weight:950;margin-top:7px;color:var(--ink)}
.metric-value.pos{color:var(--green)}.metric-value.neg{color:var(--red)}
.metric:nth-child(3),.metric:nth-child(4){background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025))}
.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:14px;font-weight:750}
@media(max-width:900px){.top{grid-template-columns:1fr}.score .value{font-size:40px}h1{font-size:39px}.logo-panel{min-height:140px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.poster{padding:16px}.chart-head{display:block}}
</style>
